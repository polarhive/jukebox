name: publish

on: push

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: "3.13"
    - name: Check tag matches package version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        expected="v$(uv version --short)"
        if [ "$expected" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected"
          exit 1
        fi
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Smoke test the wheel
      run: uv run --no-project --with dist/*.whl jukebox-fm --version
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  tag:
    name: tag release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        enable-cache: false
    - name: Tag the package version
      id: tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        tag="v$(uv version --short)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

        # Tags are only created from main; tag pushes are published as-is.
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "::notice::$tag already exists; nothing to release."
          echo "release=false" >> "$GITHUB_OUTPUT"
        else
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
        fi

  publish-to-pypi:
    name: >-
      publish to pypi
    needs:
    - build
    - tag
    if: github.ref_type == 'tag' || needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jukebox-fm
    permissions:
      id-token: write

    steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        enable-cache: false
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Generate PEP 740 attestations
      uses: astral-sh/attest-action@v0.0.7
    - name: Publish distribution to PyPI
      run: uv publish

  github-release:
    name: >-
      sign dists
    needs:
    - publish-to-pypi
    - tag
    if: needs.publish-to-pypi.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      GH_REPO: ${{ github.repository }}

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.1
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists."
        else
          gh release create "$TAG" --target "$GITHUB_SHA" --notes ""
        fi
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "$TAG" dist/** --clobber
